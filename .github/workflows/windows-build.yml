name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          "alpha=$($version -like '*-alpha*')" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        if: steps.version.outputs.alpha != 'true'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        if: steps.version.outputs.alpha != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: urwtest-rs-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/urwtest-rs.exe
          if-no-files-found: error
